openapi: 3.0.3
info:
  title: FortigiGraph Ingestion API
  description: |
    REST API for ingesting Microsoft Graph identity and entitlement data into Azure SQL.
    Supports CRUD operations for all entity types with temporal versioning.

    ## Authentication
    Authenticate using Azure AD service principals (client credentials flow).
    Obtain a Bearer token from:
    `https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/token`

    Required scope: `api://{clientId}/.default`

    ## Versioning
    API version is synchronized with the FortigiGraph PowerShell module version.

    ## Batch Operations
    Each entity supports a `/batch` endpoint for bulk upsert of up to 1000 records
    per request, using the same MERGE logic as the PowerShell sync functions.
  version: '2.3.20260313.0001'
  contact:
    name: Fortigi
    url: https://github.com/Fortigi/FortigiGraph
  license:
    name: MIT

servers:
  - url: /api/v1/ingestion
    description: Ingestion API v1

security:
  - BearerAuth: []

tags:
  - name: Users
    description: Azure AD / Entra ID users (GraphUsers table)
  - name: Groups
    description: Azure AD / Entra ID groups (GraphGroups table)
  - name: Group Members
    description: Direct group memberships (GraphGroupMembers table)
  - name: Group Owners
    description: Group ownership relationships (GraphGroupOwners table)
  - name: Group Eligible Members
    description: PIM eligible group memberships (GraphGroupEligibleMembers table)
  - name: Catalogs
    description: Entitlement Management catalogs (GraphCatalogs table)
  - name: Access Packages
    description: Entitlement Management access packages (GraphAccessPackages table)
  - name: Access Package Assignments
    description: Access package assignments to users (GraphAccessPackageAssignments table)
  - name: Access Package Resource Role Scopes
    description: Resources and roles within access packages (GraphAccessPackageResourceRoleScopes table)
  - name: Access Package Assignment Policies
    description: Assignment policies for access packages (GraphAccessPackageAssignmentPolicies table)
  - name: Access Package Assignment Requests
    description: Requests for access package assignments (GraphAccessPackageAssignmentRequests table)
  - name: Access Package Access Reviews
    description: Access review decisions (GraphAccessPackageAccessReviewDecisions table)
  - name: Health
    description: API health and version information

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Azure AD JWT token obtained via client credentials flow

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupIdPath:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: $page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: $limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    FilterParam:
      name: $filter
      in: query
      description: OData-style filter expression (e.g. `displayName eq 'Engineering'`)
      schema:
        type: string
    SelectParam:
      name: $select
      in: query
      description: Comma-separated list of fields to return
      schema:
        type: string
    AsOfParam:
      name: asOf
      in: query
      description: Point-in-time query (ISO 8601 datetime). Returns data as it existed at this moment.
      schema:
        type: string
        format: date-time

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: string

    PagedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        hasMore:
          type: boolean

    BatchRequest:
      type: object
      required: [records]
      properties:
        records:
          type: array
          maxItems: 1000
          items: {}
        mode:
          type: string
          enum: [upsert, insert, replace]
          default: upsert
          description: |
            - `upsert`: Insert new, update existing (default, MERGE semantics)
            - `insert`: Insert only, skip existing
            - `replace`: Delete all existing, insert new (full sync)

    BatchResponse:
      type: object
      properties:
        inserted:
          type: integer
        updated:
          type: integer
        deleted:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              record:
                type: object
              message:
                type: string

    User:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: Azure AD object ID (primary key)
        userPrincipalName:
          type: string
        displayName:
          type: string
        givenName:
          type: string
        surname:
          type: string
        mail:
          type: string
          format: email
        employeeId:
          type: string
        onPremisesSamAccountName:
          type: string
        onPremisesDistinguishedName:
          type: string
        companyName:
          type: string
        department:
          type: string
        jobTitle:
          type: string
        accountEnabled:
          type: boolean
        userType:
          type: string
          enum: [Member, Guest]
        onPremisesSyncEnabled:
          type: boolean
        createdDateTime:
          type: string
          format: date-time
        lastPasswordChangeDateTime:
          type: string
          format: date-time
        lastSignInDateTime:
          type: string
          format: date-time
        employeeHireDate:
          type: string
          format: date-time
        managerId:
          type: string
          format: uuid
        officeLocation:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postalCode:
          type: string
        streetAddress:
          type: string
        usageLocation:
          type: string
        preferredLanguage:
          type: string
        ageGroup:
          type: string
        organizationalUnit:
          type: string
        administrativeUnits:
          type: string
          description: Comma-separated list of administrative unit memberships

    UserBatchRequest:
      allOf:
        - $ref: '#/components/schemas/BatchRequest'
        - type: object
          properties:
            records:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/User'

    Group:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: Azure AD object ID (primary key)
        displayName:
          type: string
        description:
          type: string
        mail:
          type: string
        mailNickname:
          type: string
        onPremisesDistinguishedName:
          type: string
        mailEnabled:
          type: boolean
        securityEnabled:
          type: boolean
        groupTypes:
          type: string
          description: JSON array of group types (e.g. '["Unified"]')
        visibility:
          type: string
          enum: [Public, Private, HiddenMembership]
        createdDateTime:
          type: string
          format: date-time
        renewedDateTime:
          type: string
          format: date-time
        expirationDateTime:
          type: string
          format: date-time
        isAssignableToRole:
          type: boolean
        membershipRule:
          type: string
          description: Dynamic membership rule expression
        membershipRuleProcessingState:
          type: string
          enum: [On, Paused]
        resourceProvisioningOptions:
          type: string
        onPremisesSamAccountName:
          type: string
        onPremicesSyncEnabled:
          type: boolean
        onPremisesSecurityIdentifier:
          type: string
        onPremisesNetBiosName:
          type: string
        onPremisesDomainName:
          type: string
        groupTypeCalculated:
          type: string
          description: Computed field (Security Group, Distribution Group, Unified Group, etc.)
        organizationalUnit:
          type: string
        administrativeUnits:
          type: string

    GroupBatchRequest:
      allOf:
        - $ref: '#/components/schemas/BatchRequest'
        - type: object
          properties:
            records:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/Group'

    GroupMember:
      type: object
      required: [groupId, memberId]
      properties:
        groupId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        memberType:
          type: string
          description: OData type (e.g. '#microsoft.graph.user', '#microsoft.graph.group')

    GroupMemberBatchRequest:
      allOf:
        - $ref: '#/components/schemas/BatchRequest'
        - type: object
          properties:
            records:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/GroupMember'

    GroupOwner:
      type: object
      required: [groupId, ownerId]
      properties:
        groupId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid

    GroupOwnerBatchRequest:
      allOf:
        - $ref: '#/components/schemas/BatchRequest'
        - type: object
          properties:
            records:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/GroupOwner'

    GroupEligibleMember:
      type: object
      required: [groupId, memberId]
      properties:
        groupId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        memberType:
          type: string
          description: OData type (e.g. '#microsoft.graph.user')

    GroupEligibleMemberBatchRequest:
      allOf:
        - $ref: '#/components/schemas/BatchRequest'
        - type: object
          properties:
            records:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/GroupEligibleMember'

    Catalog:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        description:
          type: string
        catalogType:
          type: string
          enum: [userManaged, serviceDefault, serviceManaged]
        isExternallyVisible:
          type: boolean
        catalogStatus:
          type: string
        createdDateTime:
          type: string
          format: date-time
        modifiedDateTime:
          type: string
          format: date-time

    CatalogBatchRequest:
      allOf:
        - $ref: '#/components/schemas/BatchRequest'
        - type: object
          properties:
            records:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/Catalog'

    AccessPackage:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        description:
          type: string
        catalogId:
          type: string
          format: uuid
        isHidden:
          type: boolean
        isRoleScopesVisible:
          type: boolean
        createdDateTime:
          type: string
          format: date-time
        modifiedDateTime:
          type: string
          format: date-time

    AccessPackageBatchRequest:
      allOf:
        - $ref: '#/components/schemas/BatchRequest'
        - type: object
          properties:
            records:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/AccessPackage'

    AccessPackageAssignment:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        accessPackageId:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
          description: Azure AD object ID of the user receiving access
        assignmentStatus:
          type: string
        assignmentState:
          type: string
          enum: [Delivered, Delivering, Expired, Extending, PendingApproval, PendingApprovalEscalated, PendingCustomExtension, PendingExpiration, Rejected]
        schedule:
          type: string
          description: JSON-serialized schedule with startDateTime and expiration
        createdDateTime:
          type: string
          format: date-time
        modifiedDateTime:
          type: string
          format: date-time
        expiration:
          type: string
          format: date-time

    AccessPackageAssignmentBatchRequest:
      allOf:
        - $ref: '#/components/schemas/BatchRequest'
        - type: object
          properties:
            records:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/AccessPackageAssignment'

    AccessPackageResourceRoleScope:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Composite identifier (accessPackageId_roleId_scopeId)
        accessPackageId:
          type: string
          format: uuid
        roleId:
          type: string
        roleDisplayName:
          type: string
        roleDescription:
          type: string
        roleOriginSystem:
          type: string
        roleOriginId:
          type: string
        scopeId:
          type: string
        scopeDisplayName:
          type: string
        scopeOriginId:
          type: string
          format: uuid
          description: Actual group / resource GUID
        scopeOriginSystem:
          type: string
        scopeIsRootScope:
          type: boolean
        createdDateTime:
          type: string
          format: date-time
        modifiedDateTime:
          type: string
          format: date-time
        createdBy:
          type: string
        modifiedBy:
          type: string

    AccessPackageResourceRoleScopeBatchRequest:
      allOf:
        - $ref: '#/components/schemas/BatchRequest'
        - type: object
          properties:
            records:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/AccessPackageResourceRoleScope'

    AccessPackageAssignmentPolicy:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        description:
          type: string
        accessPackageId:
          type: string
          format: uuid
        createdDateTime:
          type: string
          format: date-time
        modifiedDateTime:
          type: string
          format: date-time
        hasAutoAddRule:
          type: boolean
        hasAutoRemoveRule:
          type: boolean

    AccessPackageAssignmentPolicyBatchRequest:
      allOf:
        - $ref: '#/components/schemas/BatchRequest'
        - type: object
          properties:
            records:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/AccessPackageAssignmentPolicy'

    AccessPackageAssignmentRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        accessPackageId:
          type: string
          format: uuid
        requestType:
          type: string
          enum: [UserAdd, UserRemove, AdminAdd, AdminRemove, AdminUpdate, SystemAdd, SystemRemove, SystemUpdate]
        requestState:
          type: string
          enum: [Submitted, PendingApproval, PendingApprovalEscalated, Approved, Delivering, Delivered, Denied, Canceled, Failed, PartiallyDelivered]
        targetId:
          type: string
          format: uuid
        createdDateTime:
          type: string
          format: date-time
        completedDateTime:
          type: string
          format: date-time
        expirationDateTime:
          type: string
          format: date-time
        requestedDateTime:
          type: string
          format: date-time

    AccessPackageAssignmentRequestBatchRequest:
      allOf:
        - $ref: '#/components/schemas/BatchRequest'
        - type: object
          properties:
            records:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/AccessPackageAssignmentRequest'

    AccessPackageAccessReview:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        accessReviewId:
          type: string
          format: uuid
        accessPackageId:
          type: string
          format: uuid
        assignmentId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [Approve, Deny, NotReviewed, DontKnow]
        reviewedBy:
          type: string
          format: uuid
          description: Azure AD object ID of the reviewer
        reviewedDateTime:
          type: string
          format: date-time
        createdDateTime:
          type: string
          format: date-time

    AccessPackageAccessReviewBatchRequest:
      allOf:
        - $ref: '#/components/schemas/BatchRequest'
        - type: object
          properties:
            records:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/AccessPackageAccessReview'

paths:
  /health:
    get:
      tags: [Health]
      summary: API health check
      security: []
      operationId: getHealth
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: '2.2.20260302.1045'
                  timestamp:
                    type: string
                    format: date-time

  # ─── USERS ─────────────────────────────────────────────────────────
  /users:
    get:
      tags: [Users]
      summary: List users
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/FilterParam'
        - $ref: '#/components/parameters/SelectParam'
        - $ref: '#/components/parameters/AsOfParam'
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

    post:
      tags: [Users]
      summary: Create or upsert a user
      operationId: upsertUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/batch:
    post:
      tags: [Users]
      summary: Batch upsert users (up to 1000)
      operationId: batchUpsertUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBatchRequest'
      responses:
        '200':
          description: Batch result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/AsOfParam'
      responses:
        '200':
          description: User record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

    put:
      tags: [Users]
      summary: Update user (full replace)
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

    delete:
      tags: [Users]
      summary: Delete user
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: User deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ─── GROUPS ────────────────────────────────────────────────────────
  /groups:
    get:
      tags: [Groups]
      summary: List groups
      operationId: listGroups
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/FilterParam'
        - $ref: '#/components/parameters/SelectParam'
        - $ref: '#/components/parameters/AsOfParam'
      responses:
        '200':
          description: Paginated list of groups
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Group'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

    post:
      tags: [Groups]
      summary: Create or upsert a group
      operationId: upsertGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
      responses:
        '200':
          description: Group upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /groups/batch:
    post:
      tags: [Groups]
      summary: Batch upsert groups (up to 1000)
      operationId: batchUpsertGroups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupBatchRequest'
      responses:
        '200':
          description: Batch result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /groups/{id}:
    get:
      tags: [Groups]
      summary: Get group by ID
      operationId: getGroup
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/AsOfParam'
      responses:
        '200':
          description: Group record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

    put:
      tags: [Groups]
      summary: Update group
      operationId: updateGroup
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

    delete:
      tags: [Groups]
      summary: Delete group
      operationId: deleteGroup
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Group deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ─── GROUP MEMBERS ─────────────────────────────────────────────────
  /group-members:
    get:
      tags: [Group Members]
      summary: List group members
      operationId: listGroupMembers
      parameters:
        - name: groupId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by group ID
        - name: memberId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by member ID
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/AsOfParam'
      responses:
        '200':
          description: Paginated list of group members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GroupMember'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

    post:
      tags: [Group Members]
      summary: Add a group member
