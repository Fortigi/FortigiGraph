services:

  # ── SQL Server 2022 ──────────────────────────────────────────────────────────
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "FortigiGraph_Local1!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd
        -S localhost -U sa -P "FortigiGraph_Local1!"
        -Q "SELECT 1" -b -No
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ── One-time database creation ───────────────────────────────────────────────
  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sql:
        condition: service_healthy
    command: >
      /opt/mssql-tools18/bin/sqlcmd -S sql -U sa -P "FortigiGraph_Local1!" -b -No
      -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'GraphData') CREATE DATABASE [GraphData];"
    restart: "no"

  # ── Table initialization (runs after DB creation) ────────────────────────────
  sql-table-init:
    build:
      context: .
      dockerfile: setup/docker/Dockerfile.powershell
    environment:
      SQL_SERVER: sql
      SQL_DATABASE: GraphData
      SQL_USER: sa
      SQL_PASSWORD: "FortigiGraph_Local1!"
    command: ["pwsh", "-File", "/app/setup/docker/init-tables.ps1"]
    depends_on:
      sql-init:
        condition: service_completed_successfully
    restart: "no"

  # ── Web (serves built frontend + API) ────────────────────────────────────────
  web:
    build:
      context: ./app
      dockerfile: api/Dockerfile
    environment:
      NODE_ENV: production
      USE_SQL: "true"
      SQL_SERVER: sql
      SQL_DATABASE: GraphData
      SQL_USER: sa
      SQL_PASSWORD: "FortigiGraph_Local1!"
      SQL_TRUST_SERVER_CERT: "true"
      AUTH_ENABLED: "false"
      PORT: "3001"
    ports:
      - "3001:3001"
    volumes:
      - job_data:/data/uploads
    depends_on:
      sql-table-init:
        condition: service_completed_successfully

  # ── Worker (PowerShell — crawlers, risk scoring, account correlation, scheduling) ─
  worker:
    build:
      context: .
      dockerfile: setup/docker/Dockerfile.powershell
    environment:
      SQL_SERVER: sql
      SQL_DATABASE: GraphData
      SQL_USER: sa
      SQL_PASSWORD: "${SQL_PASSWORD:-FortigiGraph_Local1!}"
      CRAWLER_API_KEY: "${CRAWLER_API_KEY:-}"
      GRAPH_TENANT_ID: "${GRAPH_TENANT_ID:-}"
      GRAPH_CLIENT_ID: "${GRAPH_CLIENT_ID:-}"
      GRAPH_CLIENT_SECRET: "${GRAPH_CLIENT_SECRET:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
    volumes:
      - ./setup/docker/crontab:/app/setup/docker/crontab:ro
      - "${CSV_DATA_PATH:-./test/datasets/DatasetLed2}:/data/csv:ro"
      - job_data:/data/uploads
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  sql_data:
  job_data:
