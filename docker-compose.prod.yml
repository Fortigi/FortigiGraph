# ─── Identity Atlas — Production Docker Compose ─────────────────────────────
#
# For end users: no git clone needed, pulls pre-built images from ghcr.io.
#
# Quick start:
#   curl -O https://raw.githubusercontent.com/Fortigi/FortigiGraph/main/docker-compose.prod.yml
#   docker compose -f docker-compose.prod.yml up
#
# Then open http://localhost:3001 and click "Load Demo Data" to get started.
#
# Configuration:
#   Copy .env.example to .env and set your values, or pass them inline:
#   GRAPH_TENANT_ID=... GRAPH_CLIENT_ID=... GRAPH_CLIENT_SECRET=... docker compose -f docker-compose.prod.yml up
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── SQL Server 2022 ──────────────────────────────────────────────────────────
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:-FortigiGraph_Local1!}"
      MSSQL_PID: "Developer"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd
        -S localhost -U sa -P "${SQL_PASSWORD:-FortigiGraph_Local1!}"
        -Q "SELECT 1" -b -No
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ── One-time database creation ───────────────────────────────────────────────
  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    command: >
      /opt/mssql-tools18/bin/sqlcmd -S sql -U sa -P "${SQL_PASSWORD:-FortigiGraph_Local1!}" -b -No
      -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'GraphData') CREATE DATABASE [GraphData];"
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

  # ── Table initialization (runs after DB creation) ────────────────────────────
  sql-table-init:
    image: ghcr.io/fortigi/identity-atlas-worker:latest
    environment:
      SQL_SERVER: sql
      SQL_DATABASE: "${SQL_DATABASE:-GraphData}"
      SQL_USER: sa
      SQL_PASSWORD: "${SQL_PASSWORD:-FortigiGraph_Local1!}"
    command: ["pwsh", "-File", "/app/setup/docker/init-tables.ps1"]
    depends_on:
      sql-init:
        condition: service_completed_successfully
    restart: "no"

  # ── Backend (serves built frontend + API) ────────────────────────────────────
  backend:
    image: ghcr.io/fortigi/identity-atlas:latest
    environment:
      NODE_ENV: production
      USE_SQL: "true"
      SQL_SERVER: sql
      SQL_DATABASE: "${SQL_DATABASE:-GraphData}"
      SQL_USER: sa
      SQL_PASSWORD: "${SQL_PASSWORD:-FortigiGraph_Local1!}"
      SQL_TRUST_SERVER_CERT: "true"
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
      PORT: "3001"
      # Entra ID auth for the UI (optional — set AUTH_ENABLED=true to activate)
      # AUTH_TENANT_ID: "${AUTH_TENANT_ID:-}"
      # AUTH_CLIENT_ID: "${AUTH_CLIENT_ID:-}"
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - job_data:/data/uploads
    depends_on:
      sql-table-init:
        condition: service_completed_successfully

  # ── Worker (crawlers, risk scoring, account correlation, scheduling) ─────────
  worker:
    image: ghcr.io/fortigi/identity-atlas-worker:latest
    environment:
      SQL_SERVER: sql
      SQL_DATABASE: "${SQL_DATABASE:-GraphData}"
      SQL_USER: sa
      SQL_PASSWORD: "${SQL_PASSWORD:-FortigiGraph_Local1!}"
      # Crawler API key (auto-discovered from SQL if not set)
      CRAWLER_API_KEY: "${CRAWLER_API_KEY:-}"
      # Entra ID Graph API credentials (optional — configure via UI or set here)
      GRAPH_TENANT_ID: "${GRAPH_TENANT_ID:-}"
      GRAPH_CLIENT_ID: "${GRAPH_CLIENT_ID:-}"
      GRAPH_CLIENT_SECRET: "${GRAPH_CLIENT_SECRET:-}"
      # LLM for risk scoring (optional)
      LLM_PROVIDER: "${LLM_PROVIDER:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
    volumes:
      - job_data:/data/uploads
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  sql_data:
  job_data:
