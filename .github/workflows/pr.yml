# ─── Pull Request Pipeline ────────────────────────────────────────────────────
# Fast checks that run on every PR. No Docker, no Azure credentials needed.
#
# Stages:
#   1. lint-ps    — PSScriptAnalyzer on all PowerShell files
#   2. lint-js    — ESLint on the frontend (app/ui)
#   3. unit-tests — Pester tests (module structure, naming, code quality)
#   4. audit      — npm audit on frontend and API packages
#
# Target branches: PRs into main or dev
# ─────────────────────────────────────────────────────────────────────────────

name: PR Checks

on:
  pull_request:
    branches: [main, dev]

env:
  DOTNET_NOLOGO: true
  POWERSHELL_TELEMETRY_OPTOUT: 1

jobs:
  # ── Stage 1: PowerShell linting ──────────────────────────────────────────
  lint-ps:
    name: 'Lint: PSScriptAnalyzer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyse PowerShell files
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./Functions -Recurse -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Host "::error::PSScriptAnalyzer found $($results.Count) issue(s)"
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no issues found" -ForegroundColor Green

  # ── Stage 2: JavaScript linting ──────────────────────────────────────────
  lint-js:
    name: 'Lint: ESLint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/ui/package-lock.json

      - name: Install dependencies
        working-directory: app/ui
        run: npm ci

      - name: Run ESLint
        working-directory: app/ui
        run: npm run lint

  # ── Stage 3: Pester unit tests ───────────────────────────────────────────
  unit-tests:
    name: 'Unit Tests: Pester'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser

      - name: Run Pester tests
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'test/unit/IdentityAtlas.Tests.ps1'
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'test-results.xml'
          $cfg.TestResult.OutputFormat = 'JUnitXml'
          $result = Invoke-Pester -Configuration $cfg
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: test-results.xml
          retention-days: 14

  # ── Stage 4: Dependency audit ────────────────────────────────────────────
  audit:
    name: 'Audit: npm audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit frontend dependencies
        working-directory: app/ui
        run: npm audit --audit-level=high

      - name: Audit API dependencies
        working-directory: app/api
        run: npm audit --audit-level=high

  # ── Summary ─────────────────────────────────────────────────────────────
  pr-summary:
    name: 'PR Summary'
    runs-on: ubuntu-latest
    needs: [lint-ps, lint-js, unit-tests, audit]
    if: always()
    steps:
      - name: Report results
        run: |
          echo "## PR Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for job in lint-ps lint-js unit-tests audit; do
            result=$(echo '${{ toJSON(needs) }}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('$job', {}).get('result','unknown'))")
            if [ "$result" = "success" ]; then icon="✅"; else icon="❌"; fi
            echo "- ${icon} ${job}: ${result}" >> $GITHUB_STEP_SUMMARY
          done

      - name: Fail if any check failed
        if: |
          needs.lint-ps.result == 'failure' ||
          needs.lint-js.result == 'failure' ||
          needs.unit-tests.result == 'failure' ||
          needs.audit.result == 'failure'
        run: exit 1
